[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synapse"
version = "4.0.0"
description = "Synapse — Knowledge Framework v4 (PostgreSQL pgvector)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "pgvector>=0.4.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pyyaml>=6.0",
    "mcp>=1.0.0",
    "beautifulsoup4>=4.12",
    "youtube-transcript-api>=0.6",
    "pypdf>=4.0",
    "python-docx>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "testcontainers[postgres]>=4.0",
]
init = [
    "pypdf>=4.0",
    "python-docx>=1.0",
]

[project.scripts]
synapse = "src.main:cli_main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]